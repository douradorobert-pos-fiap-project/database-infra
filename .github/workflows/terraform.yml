name: Database Infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init without remote backend
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Automated tests
        working-directory: .
        run: python3 -m unittest discover tests -v

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: sandbox
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      OS_DATABASE: ${{ vars.OS_DATABASE }}
      OS_DATABASE_USERNAME: ${{ vars.OS_DATABASE_USERNAME }}
      OS_DB_PASSWORD: ${{ secrets.OS_DB_PASSWORD }}
      BILLING_DATABASE: ${{ vars.BILLING_DATABASE }}
      BILLING_DATABASE_USERNAME: ${{ vars.BILLING_DATABASE_USERNAME }}
      BILLING_DB_PASSWORD: ${{ secrets.BILLING_DB_PASSWORD }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_username: ${{ vars.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Validate required deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: bash scripts/validate-deployment-config.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate AWS sandbox prerequisites
        run: bash scripts/validate-sandbox-config.sh

      - name: Terraform Plan with remote state
        run: ./scripts/plan-database.sh

      - name: Terraform Apply
        run: ./scripts/apply-database.sh

      - name: Read RDS connection outputs
        id: rds
        run: |
          printf 'endpoint=%s\n' "$(terraform -chdir=terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"
          printf 'port=%s\n' "$(terraform -chdir=terraform output -raw rds_port)" >> "$GITHUB_OUTPUT"

      - name: Update EKS kubeconfig
        id: kubeconfig
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get namespace oficina

      - name: Synchronize database bootstrap resources
        env:
          RDS_ENDPOINT: ${{ steps.rds.outputs.endpoint }}
          RDS_PORT: ${{ steps.rds.outputs.port }}
        run: bash scripts/render-database-bootstrap-secret.sh

      - name: Bootstrap logical databases
        run: |
          kubectl -n oficina delete job database-bootstrap --ignore-not-found
          kubectl apply -f k8s/database-bootstrap-job.yaml
          if ! kubectl -n oficina wait --for=condition=complete job/database-bootstrap --timeout=180s; then
            kubectl -n oficina logs job/database-bootstrap || true
            kubectl -n oficina describe job/database-bootstrap || true
            exit 1
          fi
          kubectl -n oficina logs job/database-bootstrap

      - name: Remove database administrator Secret
        if: ${{ always() && steps.kubeconfig.outcome == 'success' }}
        run: kubectl -n oficina delete secret database-bootstrap-secrets --ignore-not-found
